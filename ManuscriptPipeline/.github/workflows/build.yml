name: Build ManuscriptPipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      - name: Build Release
        run: dotnet build ManuscriptPipeline.slnx --configuration Release --no-restore