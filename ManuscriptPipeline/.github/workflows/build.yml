name: Build ManuscriptPipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      - name: Build Release
        run: dotnet build ManuscriptPipeline.slnx --configuration Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ManuscriptPipeline-win-x64
          path: publish/win-x64/
          if-no-files-found: error