name: Release PaperRoute Tracker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      - name: Publish Windows x64
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path "${{ github.workspace }}/publish/win-x64/*" -DestinationPath "${{ github.workspace }}/PaperRouteTracker-win-x64.zip" -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "-") {
            gh release create $tag "PaperRouteTracker-win-x64.zip" --title "PaperRoute Tracker $tag" --generate-notes --prerelease
          }
          else {
            gh release create $tag "PaperRouteTracker-win-x64.zip" --title "PaperRoute Tracker $tag" --generate-notes
          }
