name: CI
run-name: "CI • ${{ github.ref_name }}"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      - name: Build Release
        run: dotnet build ManuscriptPipeline.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test PaperRoute.Tests/PaperRoute.Tests.vbproj --configuration Release --no-build --logger "trx;LogFileName=PaperRoute.Tests.trx" --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PaperRoute-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows x64
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: PaperRouteTracker-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14
